name: Fork 718 upstream UI interaction checks
permissions:
  contents: read
jobs:
  e2e-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: npm
        cache-dependency-path: flowfile_frontend/package-lock.json
    - name: Install Poetry
      run: 'pip install poetry

        poetry config virtualenvs.create true

        poetry config virtualenvs.in-project true

        '
    - name: Check poetry.lock is up to date
      run: poetry check --lock
    - name: Cache Poetry dependencies
      uses: actions/cache@v4
      with:
        path: .venv
        key: poetry-${{ runner.os }}-${{ hashFiles('poetry.lock') }}
        restore-keys: 'poetry-${{ runner.os }}-

          '
    - name: Install backend dependencies
      run: poetry install --no-interaction --no-ansi
    - name: Install frontend dependencies
      working-directory: flowfile_frontend
      run: npm ci
    - name: Install Playwright browsers
      working-directory: flowfile_frontend
      run: npx playwright install --with-deps chromium
    - name: Build frontend
      working-directory: flowfile_frontend
      run: npm run build:web
    - name: Start MinIO and seed the cloud E2E source
      run: 'poetry run start_minio

        poetry run seed_cloud_e2e

        '
    - name: Write the MinIO AWS profile and server working directories
      run: "mkdir -p \"$RUNNER_TEMP/aws\" \"$RUNNER_TEMP/core_cwd\" \"$RUNNER_TEMP/worker_cwd\"\nprintf '[default]\\\
        naws_access_key_id = minioadmin\\naws_secret_access_key = minioadmin\\n' > \"$RUNNER_TEMP/aws/credentials\"\
        \nprintf '[default]\\nregion = us-east-1\\n' > \"$RUNNER_TEMP/aws/config\"\n{\n  echo \"AWS_SHARED_CREDENTIALS_FILE=$RUNNER_TEMP/aws/credentials\"\
        \n  echo \"AWS_CONFIG_FILE=$RUNNER_TEMP/aws/config\"\n  echo \"AWS_ENDPOINT_URL=http://localhost:9000\"\n\
        \  echo \"AWS_ALLOW_HTTP=true\"\n  echo \"AWS_EC2_METADATA_DISABLED=true\"\n} >> \"$GITHUB_ENV\"\n"
    - name: Start backend server
      working-directory: ${{ runner.temp }}/core_cwd
      env:
        FLOWFILE_TELEMETRY: '0'
        FLOWFILE_EXCHANGE_URI: s3://flowfile-e2e/placement-exchange
      run: "poetry -P \"$GITHUB_WORKSPACE\" run flowfile_core > \"$RUNNER_TEMP/core.log\" 2>&1 &\necho \"Waiting\
        \ for backend to start...\"\nfor i in {1..30}; do\n  if curl -s http://localhost:63578/auth/token -X POST\
        \ > /dev/null 2>&1; then\n    echo \"Backend is ready!\"\n    break\n  fi\n  echo \"Attempt $i: Backend\
        \ not ready yet...\"\n  sleep 2\ndone\n"
    - name: Start worker server
      working-directory: ${{ runner.temp }}/worker_cwd
      run: "poetry -P \"$GITHUB_WORKSPACE\" run flowfile_worker > \"$RUNNER_TEMP/worker.log\" 2>&1 &\necho \"Waiting\
        \ for worker to start...\"\nfor i in {1..30}; do\n  if curl -s http://localhost:63579/docs > /dev/null 2>&1;\
        \ then\n    echo \"Worker is ready!\"\n    break\n  fi\n  echo \"Attempt $i: Worker not ready yet...\"\n\
        \  sleep 2\ndone\n"
    - name: Start frontend preview server
      working-directory: flowfile_frontend
      run: "npm run preview:web &\necho \"Waiting for frontend to start...\"\nfor i in {1..15}; do\n  if curl -s\
        \ http://localhost:4173 > /dev/null 2>&1; then\n    echo \"Frontend is ready!\"\n    break\n  fi\n  echo\
        \ \"Attempt $i: Frontend not ready yet...\"\n  sleep 2\ndone\n"
    - name: Run E2E tests
      working-directory: flowfile_frontend
      env:
        TEST_URL: http://localhost:4173
        API_URL: http://localhost:63578
        E2E_AWS_PROFILE_CONFIGURED: '1'
      run: npx playwright test tests/web-flow.spec.ts tests/node-handle-labels.spec.ts --reporter=html,json > playwright-results.json
    - name: Require executed UI tests without skips or failures
      working-directory: flowfile_frontend
      run: 'node - <<''JS''

        const assert = require(''node:assert/strict'');

        const report = require(''./playwright-results.json'');

        assert(report.stats.expected > 0, ''No passing UI tests'');

        assert.equal(report.stats.skipped, 0, ''Unexpected skipped UI tests'');

        assert.equal(report.stats.unexpected, 0, ''Failed UI tests'');

        assert.equal(report.stats.flaky, 0, ''Flaky UI tests'');

        console.log(JSON.stringify(report.stats));

        JS'
    - name: Issue 718 real drag and persistence regression
      env:
        FLOWFILE_CHECKOUT: ${{ github.workspace }}
        TEST_URL: http://localhost:4173
        API_URL: http://localhost:63578
        BROWSER_RESULTS: ${{ runner.temp }}/ports-ui
      run: node .github/diagnostics/browser-ports-smoke.cjs
    - name: Check the servers wrote nothing into their working directories
      if: success() || failure()
      run: "status=0\nfor dir in core_cwd worker_cwd; do\n  if [ -d \"$RUNNER_TEMP/$dir\" ] && [ -n \"$(ls -A \"\
        $RUNNER_TEMP/$dir\")\" ]; then\n    echo \"::error::Files were written into the server working directory\
        \ $dir:\"\n    ls -laR \"$RUNNER_TEMP/$dir\"\n    status=1\n  fi\ndone\nexit $status\n"
    - name: Upload Playwright report
      uses: actions/upload-artifact@v4
      if: failure()
      with:
        name: playwright-report
        path: flowfile_frontend/playwright-report/
        retention-days: 7
    - name: Upload server logs
      uses: actions/upload-artifact@v4
      if: failure()
      with:
        name: server-logs
        path: '${{ runner.temp }}/core.log

          ${{ runner.temp }}/worker.log

          '
        retention-days: 7
    - name: Upload test results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: test-results
        path: flowfile_frontend/test-results/
        retention-days: 7
    - name: Upload interaction evidence
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: ports-ui-evidence
        path: '${{ runner.temp }}/ports-ui/

          flowfile_frontend/playwright-results.json'
        retention-days: 7
'on':
  push:
    branches:
    - diagnostic/718-sqlserver-check
