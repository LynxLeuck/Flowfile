name: Fork 718 zero-volume diagnostic

permissions:
  contents: read

on:
  push:
    branches: [diagnostic/718-sqlserver-check]

jobs:
  zero-volume-compose:
    name: Zero-volume compose
    runs-on: ubuntu-latest
    timeout-minutes: 75

    env:
      COMPOSE_PROJECT_NAME: flowfile-remote-worker-${{ github.run_id }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Poetry
        run: |
          curl -sSL https://install.python-poetry.org | python -
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Cache Poetry dependencies
        uses: actions/cache@v4
        with:
          path: .venv
          key: poetry-${{ runner.os }}-${{ hashFiles('poetry.lock') }}
          restore-keys: |
            poetry-${{ runner.os }}-

      - name: Install dependencies
        run: |
          poetry config virtualenvs.create true
          poetry config virtualenvs.in-project true
          poetry install --no-interaction --no-ansi

      # The fixture's image build alone may take 25 minutes.
      - name: Run the zero-volume compose test
        run: poetry run pytest tests/remote_worker/test_zero_volumes.py -vv --tb=short --junitxml=zero-volume-results.xml
        timeout-minutes: 45

      - name: Verify all seven tests actually passed
        run: |
          python - <<'PY'
          import json, xml.etree.ElementTree as ET
          from pathlib import Path
          suites = list(ET.parse('zero-volume-results.xml').getroot().iter('testsuite'))
          counts = {k: sum(int(s.get(k, 0)) for s in suites) for k in ['tests', 'failures', 'errors', 'skipped']}
          assert counts == {'tests': 7, 'failures': 0, 'errors': 0, 'skipped': 0}, counts
          Path('zero-volume-summary.json').write_text(json.dumps(counts, indent=2))
          print(counts)
          PY

      - name: Upload compact test evidence
        uses: actions/upload-artifact@v4
        with:
          name: zero-volume-results
          path: zero-volume-summary.json
          if-no-files-found: error

      - name: Remove the compose project
        if: always()
        run: docker compose -f docker-compose.remote-worker.yml -p "$COMPOSE_PROJECT_NAME" down -v --remove-orphans || true
