name: Fork 879 subflow lifecycle
on:
  push:
    branches: [diagnostic/879-subflow-lifecycle]
permissions:
  contents: read
jobs:
  lifecycle:
    if: github.repository == 'LynxLeuck/Flowfile'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install project dependencies
        run: |
          pip install poetry
          poetry install --no-interaction --no-ansi --with dev
      - name: Run existing subflow and port regressions
        env:
          FLOWFILE_WORKER_POOL_SIZE: '2'
        run: |
          poetry run pytest flowfile_core/tests/test_run_flow_node.py flowfile_core/tests/flowfile/test_subflow_nodes.py flowfile_core/tests/test_node_ports.py flowfile_core/tests/test_node_ports_api.py flowfile_core/tests/ai/test_diff.py flowfile_core/tests/ai/test_executor.py flowfile_core/tests/flowfile/test_flow_graph_utils.py -ra --disable-warnings --junitxml=lifecycle-results.xml
          poetry run python - <<'PY'
          import xml.etree.ElementTree as ET
          root = ET.parse('lifecycle-results.xml').getroot()
          cases = list(root.iter('testcase'))
          assert cases, 'No tests ran'
          assert not list(root.iter('skipped')), 'Unexpected skipped tests'
          assert any(c.attrib['name'] == 'test_remap_on_slot_change_drops_vanished_and_follows_renames' for c in cases)
          PY
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lifecycle-results
          path: lifecycle-results.xml
          if-no-files-found: warn
