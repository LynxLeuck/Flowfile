name: PR859 native crash diagnostic

on:
  push:
    branches: [diagnostic/pr859-native-crash]

permissions:
  contents: read

jobs:
  native-crash:
    if: github.repository == 'LynxLeuck/Flowfile'
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    env:
      FLOWFILE_WORKER_POOL_SIZE: "2"
      PYTHONFAULTHANDLER: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Verify original CI application tree
        shell: bash
        run: |
          git log -1 --format='%H %P'
          git diff --exit-code 4d43eead3d12f6ac3a4f371c2152309c1ba294a6 HEAD -- . ':(exclude).github/workflows/test.yaml'
          test "$(uname -m)" = x86_64
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13.17'
      - name: Install isolated Poetry 2.5.1 and debugger
        shell: bash
        run: |
          python -m venv "$RUNNER_TEMP/pr859-poetry"
          "$RUNNER_TEMP/pr859-poetry/bin/python" -m pip install poetry==2.5.1
          echo "$RUNNER_TEMP/pr859-poetry/bin" >> "$GITHUB_PATH"
          if ! command -v gdb; then
            sudo apt-get update
            sudo apt-get install -y gdb
          fi
      - name: Install original locked dependencies
        run: poetry install --no-interaction --no-ansi --with dev
      - name: Record interpreter and native package versions
        run: |
          poetry --version
          poetry run python -c 'import sys,platform,numpy,sqlalchemy,greenlet,polars,pyarrow,deltalake; print(sys.version,platform.machine()); print({m.__name__:m.__version__ for m in [numpy,sqlalchemy,greenlet,polars,pyarrow,deltalake]}); assert sys.version_info[:3] == (3,13,17); assert numpy.__version__ == "1.26.4"'
      - name: Start original database and object-store fixtures
        shell: bash
        run: |
          poetry run start_postgres
          poetry run start_mysql
          poetry run start_mssql
          poetry run start_minio
          poetry run start_azurite
          poetry run start_gcs
      - name: Replay original shared step
        shell: bash
        run: poetry run pytest shared/tests --ignore=shared/tests/kafka --disable-warnings 2>&1 | tee pr859-shared.log
      - name: Replay original frame step
        shell: bash
        run: poetry run pytest flowfile_frame/tests --disable-warnings 2>&1 | tee pr859-frame.log
      - name: Run original core suite under native debugger
        shell: bash
        run: |
          ulimit -c 0
          python_bin="$(poetry run python -c 'import sys; print(sys.executable)')"
          set +e
          gdb --batch --return-child-result \
            -ex 'set pagination off' \
            -ex 'set confirm off' \
            -ex 'set print frame-arguments none' \
            -ex 'set print entry-values no' \
            -ex 'handle SIGPIPE nostop noprint pass' \
            -ex 'handle SIGALRM nostop noprint pass' \
            -ex run \
            -ex 'thread apply all bt' \
            --args "$python_bin" -X faulthandler -m pytest flowfile_core/tests -m 'not kernel' -vv --disable-warnings --durations=300 --durations-min=0.05 --junitxml=pr859-core.xml \
            2>&1 | tee pr859-native.log
          code=${PIPESTATUS[0]}
          printf '%s\n' "$code" > pr859-native-exit-code.txt
          exit "$code"
      - name: Preserve diagnostic output even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr859-native-diagnostic
          retention-days: 7
          if-no-files-found: warn
          path: |
            pr859-shared.log
            pr859-frame.log
            pr859-native.log
            pr859-native-exit-code.txt
            pr859-core.xml
